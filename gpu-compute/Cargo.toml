[package]
name = "gpu-compute"
version = "1.0.0"
edition = "2024"
description = "GPU-accelerated compute primitives for Space Analyzer"

[lib]
name = "gpu_compute"
crate-type = ["rlib"]

[dependencies]
# Workspace dependencies
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
blake3 = { workspace = true }

# CUDA bindings
cudarc = { version = "0.19", features = ["cuda-12040"], optional = true }

# Fallback CPU implementations
ndarray = { version = "0.17", features = ["rayon"] }
rand = "0.10"

[features]
default = []
cuda = ["cudarc"]
