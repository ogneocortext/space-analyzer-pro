# Clippy configuration for Space Analyzer Pro
# Run: cargo clippy --all-targets --all-features

# Pedantic lints (enable all, then disable noisy ones)
warn = [
    "clippy::all",
]

# Disable overly noisy pedantic lints
allow = [
    "clippy::missing_errors_doc",
    "clippy::missing_panics_doc",
    "clippy::module_name_repetitions",
    "clippy::similar_names",
    "clippy::too_many_lines",
    "clippy::type_complexity",
]

# Deny certain lints (uncomment if you want stricter enforcement)
# deny = [
#     "clippy::unwrap_used",
#     "clippy::expect_used",
#     "clippy::panic",
#     "clippy::todo",
# ]