[package]
name = "scan-engine"
version = "1.0.0"
edition = "2024"
description = "Shared file scanner engine library for Space Analyzer Pro"

[lib]
name = "scan_engine"
crate-type = ["rlib"]

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
blake3 = { workspace = true }
walkdir = { workspace = true }
crossbeam-channel = { workspace = true }

# Additional dependencies
sysinfo = "0.39"
gpu-compute = { path = "../gpu-compute", optional = true }
num_cpus = "1.17"

[features]
default = []
gpu = ["dep:gpu-compute"] # GPU-accelerated scanning

[dev-dependencies]
tempfile = "3"
proptest = "1"