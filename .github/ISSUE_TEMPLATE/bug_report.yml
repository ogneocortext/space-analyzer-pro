name: Bug report
description: Report a defect in Space Analyzer Pro (Rust core or WinUI 3 GUI)
title: "[BUG] <short summary>"
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected?
      options:
        - Rust CLI / scanner (space-analyzer-cli)
        - WinUI 3 desktop GUI
        - Semantic search / embeddings
        - AI Assistant / agentic tools
        - Installed-apps inventory
        - Database / history
        - Dashboard server / vision pipeline
        - Build / packaging
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue? Include the exact CLI command or GUI steps.
      placeholder: |
        1. Run `cargo run --bin space-analyzer-cli -- scan --path "..."`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, PowerShell version, Rust toolchain, WinUI/Windows App SDK version.
      placeholder: |
        - OS: Windows 11 24H2
        - PowerShell: 7.6.5
        - Rust: 1.8x
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I confirmed this is not a stale web-era (Vue/Tauri) issue — this repo is Rust core + WinUI 3.
          required: true
