name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Disable schedule trigger to save minutes; use manual dispatch instead.
  workflow_dispatch:

# Cancel in-progress runs for the same branch on new pushes.
# Saves minutes and prevents redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  check:
    name: Format, Lint, Test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo (registry, git, target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: ${{ runner.os }}-cargo

      - name: Fail on large files (>5 MB)
        run: |
          $large = Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 5MB -and $_.FullName -notmatch '\\target\\' } |
            Select-Object -First 5
          if ($large) {
            $large | ForEach-Object { Write-Output "  $($_.FullName): $([Math]::Round($_.Length/1MB,2)) MB" }
            Write-Error "Found files >5MB; add to .gitignore and `git rm --cached`"
            exit 1
          }
          Write-Output "OK: no tracked files >5MB"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --no-fail-fast
