[package]
name = "snap"
version = "0.1.0"
edition = "2021"

[dependencies]
headless_chrome = "1.0"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
rayon = "1.7"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = "line-tables-only"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[build]
rustflags = ["-C", "target-cpu=native"]