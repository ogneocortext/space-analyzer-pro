[package]
name = "space-analyzer-pro-desktop"
version = "3.7.0"
description = "Self-Contained AI-Powered Space Analyzer Desktop Application"
authors = ["Space Analyzer Team"]
edition = "2021"

[workspace]
members = [
    "shared-scanner",
    "gpu-compute",
    "native/scanner",
    "native/file_deduplicator",
    "native/node_modules_cleaner",
    "web",
]

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# Common utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
rayon = "1.12"
regex = "1.12"
blake3 = "1.8"
walkdir = "2.5"

[lib]
name = "space_analyzer_pro_desktop"
path = "src/lib.rs"

[[bin]]
name = "space-analyzer-pro"
path = "src/main.rs"

[[bin]]
name = "space-analyzer-gui"
path = "src/bin/space-analyzer-gui.rs"

[[bin]]
name = "ollama-test"
path = "src/bin/ollama-test.rs"

[[bin]]
name = "ollama-features"
path = "src/bin/ollama-features.rs"

[dependencies]
shared-scanner = { path = "shared-scanner", features = ["gpu"] }
gpu-compute = { path = "gpu-compute" }
file-deduplicator = { path = "native/file_deduplicator" }
# Core functionality (workspace-inherited)
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
once_cell = "1"

# File system operations
dirs = "6.0"
which = "8.0"
open = "5.3"
walkdir = { workspace = true }
trash = "5"

# GUI
eframe = "0.34"
egui = "0.34"
egui_extras = { version = "0.34", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
egui_plot = "0.35"
rfd = "0.17"
egui-phosphor = { version = "^0.12", package = "egui-phosphor", default-features = false, features = ["light", "regular"] }
egui-elegance = { version = "^0.11", package = "egui-elegance", default-features = false }

# Data processing
regex = { workspace = true }
base64 = "0.22"
sha2 = "0.11"
blake3 = { workspace = true }
rayon = { workspace = true }

# Compression and archives
flate2 = "1.1"
tar = "0.4"
zip = "2"

# Configuration
config = "0.15"
toml = "0.8"
clap = { version = "4.6", features = ["derive"] }

# Progress and UI
indicatif = "0.18"
colored = "3.1"
console = "0.16"
dialoguer = "0.12"

# System information
num_cpus = "1.17"
humantime = "2.3"
bytesize = "2.4"

# Embedded SQLite database (self-contained persistence)
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }

# HTTP client for optional Ollama AI service integration
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
bytes = "1"

# Async runtime for HTTP calls
futures = "0.3"

# Web server
axum = { version = "0.8", features = ["json", "macros"] }
tokio-tungstenite = "0.21"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
rust-embed = "8"
mime_guess = "2"

# System disk info
sysinfo = "0.39"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation"
] }

[target.'cfg(unix)'.dependencies]
# Unix-specific dependencies if needed
nix = "0.31"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"
pretty_assertions = "1"

[profile.dev]
incremental = false
opt-level = 1
debug = true

# ──────────────────────────────────────────────────────────────
#  Integration tests (tests/unit/)
# ──────────────────────────────────────────────────────────────

[[test]]
name = "shared_scanner_test"
path = "tests/unit/shared_scanner_test.rs"

[[test]]
name = "cli_test"
path = "tests/unit/cli_test.rs"

[[test]]
name = "system_monitor_test"
path = "tests/unit/system_monitor_test.rs"

[[test]]
name = "ollama_reliability_test"
path = "tests/unit/ollama_reliability_test.rs"

[[test]]
name = "ollama_function_calling_test"
path = "tests/unit/ollama_function_calling_test.rs"
