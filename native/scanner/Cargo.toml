[package]
name = "space-analyzer-scanner"
version = "1.0.0"
edition = "2021"
authors = ["Space Analyzer Team"]
description = "High-performance file analysis CLI for Space Analyzer Pro"
license = "MIT"

[lib]
name = "space_scanner"
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
walkdir = "2.5"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
temporal_rs = "0.2"
tokio = { version = "1", features = ["full"] }
md5 = "0.7"
regex = "1.12"
rayon = "1.12"
crossbeam = "0.8"
num_cpus = "1.17"
napi = { version = "2", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "2", optional = true }

# Windows-specific dependencies for all NTFS and Windows features
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "fileapi",          # File operations, streams, compression
    "handleapi",        # Handle management
    "winbase",          # File information, times, FindFirstFileNameW
    "winnt",            # NT definitions, security
    "minwindef",        # Basic types
    "aclapi",           # Security descriptors, ownership
    "accctrl",          # Access control
    "securitybaseapi",  # Security constants, GetTokenInformation
    "processthreadsapi", # GetCurrentProcess, OpenProcessToken
    "sddl",             # SID conversion (ConvertSidToStringSidW)
    "std",              # Standard definitions
    "winioctl",         # I/O control codes (FSCTL_*)
    "ioapiset",         # DeviceIoControl
    "errhandlingapi",   # GetLastError
] }

[build-dependencies]
napi-build = { version = "2", optional = true }