[package]
name = "space-scanner"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "space-analyzer"
path = "src/main.rs"

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
tokio = { version = "1", features = ["full"] }
walkdir = "2.3"
rayon = "1.7"
memmap2 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8"
crossbeam-channel = "0.5"  # Explicit channel dependency
num_cpus = "1.16"
sysinfo = "0.30"  # For system info in get_system_info()
rustc_version_runtime = "0.3"  # For runtime Rust version detection
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
