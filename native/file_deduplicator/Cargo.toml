[package]
name = "file-deduplicator"
version = "1.0.0"
edition = "2024"
authors = ["Space Analyzer Team"]
description = "High-performance file deduplicator with BLAKE3 hashing and hard link support"
license = "MIT"

[[bin]]
name = "file-deduplicator"
path = "src/main.rs"

[lib]
name = "file_deduplicator"
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

# File system and hashing
walkdir = "2.5"
blake3 = "1.8"
num_cpus = "1.17"
same-file = "1.0"

# GPU acceleration
gpu-compute = { path = "../../gpu-compute" }

# Progress tracking and CLI
indicatif = "0.18"
console = "0.16"
colored = "3.1"

[dev-dependencies]
tempfile = "3"
