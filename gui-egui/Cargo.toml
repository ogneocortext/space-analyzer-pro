[package]
name = "space-analyzer-gui-egui"
version = "3.7.0"
description = "Space Analyzer Pro — egui Desktop GUI"
authors = ["Space Analyzer Team"]
edition = "2021"

[[bin]]
name = "space-analyzer-gui"
path = "src/main.rs"

[dependencies]
# Core library (workspace root crate)
space-analyzer = { path = ".." }
shared-scanner = { path = "../shared-scanner", features = ["gpu"] }
file-deduplicator = { path = "../native/file_deduplicator" }

# GUI framework
eframe = "0.34"
egui = "0.34"
egui_extras = { version = "0.34", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
egui_plot = "0.35"
rfd = "0.17"
egui-phosphor = { version = "^0.12", package = "egui-phosphor", default-features = false, features = ["light", "regular"] }
egui-elegance = { version = "^0.11", package = "egui-elegance", default-features = false }

# Core deps (explicit versions, not workspace-inherited)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
regex = "1.12"
uuid = { version = "1.23", features = ["v4", "serde"] }

# System info
sysinfo = "0.39"
num_cpus = "1.17"
humantime = "2.3"
bytesize = "2.4"
open = "5.3"

# HTTP (for Ollama)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
bytes = "1"
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
tracing-appender = "0.2"

# Windows
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
